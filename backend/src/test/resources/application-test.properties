# Test profile: H2 in-memory database
# This profile is activated by @ActiveProfiles("test") in test classes.
# It overrides the NeonDB PostgreSQL configuration in application.properties.
# The production configuration is NOT affected.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Disable seeding in tests (unit tests mock their own data)
app.seed.enabled=false

# Override CORS env var (required by application.properties but not set in test env)
cors.allowed-origins=http://localhost:3000
